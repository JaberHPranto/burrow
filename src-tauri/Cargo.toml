[package]
name = "burrow"
version = "0.1.0"
description = "A cozy burrow of developer utilities for Linux"
edition = "2021"
rust-version = "1.77"

[lib]
name = "burrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time", "fs", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
