<!doctype html>
<!--
  Burrow's GitHub banner (README header + social preview), 1280×640.
  Regenerate: open this file in a browser (fonts come from node_modules, so run
  `npm install` first), set the viewport to 1280×640 and take a 2× screenshot,
  saved as docs/banner.jpg (JPEG ~90%, under 1 MB for GitHub social previews). The app screenshot is docs/banner/app.jpg.
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/outfit/index.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/plus-jakarta-sans/index.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
<style>
  :root {
    --mint: #88cca6; --butter: #f8e192; --aqua: #a8dadc; --coral: #f28b82;
    --cream: #f7f4ec; --ink: #181a20; --bg: #181a20; --muted: #a3a8b5;
    --burrow-mound: #3a3f4c; --burrow-hole: #0b0c10; --burrow-rim: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    font-family: "Plus Jakarta Sans Variable", sans-serif; color: var(--cream);
    background:
      radial-gradient(520px 380px at 86% 16%, rgba(136, 204, 166, 0.20), transparent 70%),
      radial-gradient(560px 380px at 74% 100%, rgba(242, 139, 130, 0.18), transparent 70%),
      radial-gradient(480px 360px at 4% 0%, rgba(168, 218, 220, 0.13), transparent 70%),
      radial-gradient(420px 300px at 20% 100%, rgba(248, 225, 146, 0.08), transparent 70%),
      var(--ink);
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.2px);
    background-size: 22px 22px;
    mask-image: linear-gradient(90deg, black, transparent 55%, transparent 80%, black);
  }
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 470px;
    display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .brand { display: flex; align-items: flex-end; gap: 10px; margin-left: -14px; }
  .brand svg { display: block; filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
  h1 { margin: 0 0 12px; font-family: "Outfit Variable", sans-serif; font-weight: 700;
    font-size: 104px; line-height: .9; letter-spacing: -3px; }
  .tagline { margin: 0; font-family: "Outfit Variable", sans-serif; font-weight: 600;
    font-size: 34px; line-height: 1.15; letter-spacing: -.5px; }
  .tagline em { font-style: normal; color: var(--mint); position: relative; }
  .tagline em::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 8px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 8'><path d='M0 4 Q5 0 10 4 T20 4 T30 4 T40 4' fill='none' stroke='%2388cca6' stroke-width='2.5' stroke-linecap='round'/></svg>") repeat-x;
    background-size: 20px 8px; }
  .desc { margin: 0; font-size: 19px; line-height: 1.55; color: var(--muted); max-width: 440px; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 6px; }
  .chip { font-family: "JetBrains Mono Variable", monospace; font-size: 13px; letter-spacing: .02em;
    padding: 6px 12px; border-radius: 999px; color: var(--cream);
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  .chip b { color: var(--mint); font-weight: 600; }

  .stage { position: absolute; left: 600px; top: 118px; width: 616px; height: 390px; }
  .shot { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; transform: rotate(-2deg);
    box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.10), 0 0 0 8px rgba(255,255,255,.03); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .glow { position: absolute; inset: -40px; border-radius: 40px; transform: rotate(-2deg);
    background: radial-gradient(closest-side, rgba(136,204,166,.25), transparent); filter: blur(30px); }
  .tile { position: absolute; width: 66px; height: 66px; border-radius: 19px; display: grid; place-items: center;
    color: var(--ink); border: 2px solid var(--ink);
    box-shadow: 4px 5px 0 var(--ink), 0 18px 34px rgba(0,0,0,.45); }
  .tile svg { width: 30px; height: 30px; }
  .tile--mint { background: var(--mint); } .tile--butter { background: var(--butter); }
  .tile--aqua { background: var(--aqua); } .tile--coral { background: var(--coral); }
  .star { position: absolute; display: block; filter: drop-shadow(0 0 6px currentColor); }
  .star svg { width: 100%; height: 100%; display: block; }
</style>
</head>

  <h1>Burrow</h1>
  <p class="tagline">Your <em>cozy</em> dev toolbox<br />for Linux</p>
  <p class="desc">A Spotlight-style launcher with screenshots, OCR, clipboard history, emoji and bring-your-own-key AI. One hotkey away.</p>

    <span class="chip"><b>Tauri 2</b> · Rust</span>
    <span class="chip"><b>Local</b> first</span>
